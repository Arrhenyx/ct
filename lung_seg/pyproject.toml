[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lung-seg"
version = "0.1.0"
description = "3D lung nodule segmentation with MONAI UNETR"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "nibabel>=5.0",
    "monai>=1.3",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "connected-components-3d>=3.12",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.scripts]
lung-seg = "lung_seg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
