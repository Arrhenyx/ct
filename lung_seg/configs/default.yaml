# Data
data_dir: data
k_folds: 5
fold: 0
seed: 42

# Preprocessing
pixdim: [1.0, 1.0, 1.0]
hu_min: -1000.0
hu_max: 400.0

# Patch / ROI
roi_size: [96, 96, 96]
num_samples: 4
pos_ratio: 1.0
neg_ratio: 1.0

# Model
# One of: unetr, swinunetr, unet
model_name: unetr
feature_size: 16
hidden_size: 768
mlp_dim: 3072
num_heads: 12
dropout: 0.1
swin_feature_size: 48

# Optimization
batch_size: 2
val_batch_size: 1
accum_steps: 2
lr: 1.0e-4
weight_decay: 1.0e-5
max_epochs: 200
val_interval: 2
patience: 20
early_stop_delta: 0.001
grad_clip: 1.0
amp: true

# Inference
sw_overlap: 0.6
sw_batch_size: 2
sw_mode: gaussian
min_cc_size: 27
tta: false

# I/O
output_dir: predictions
ckpt_dir: checkpoints
log_dir: logs